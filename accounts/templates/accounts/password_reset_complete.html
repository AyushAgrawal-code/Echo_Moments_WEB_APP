{% extends "base.html" %}
{% block title %}Password updated · EchoMoments{% endblock %}
{% block body %}
<main class="echo-container" style="max-width:36rem;padding:3rem 1rem">
  <section class="echo-card" role="status">
    <h1>Password updated</h1>
    <p>Your password was changed. You can now sign in with the new password.</p>
    <a class="echo-button-primary" href="{% url 'accounts:login' %}">Sign in</a>
  </section>
</main>
{% endblock %}
