{% extends "base.html" %}
{% block title %}Check your email · EchoMoments{% endblock %}
{% block body %}
<main class="echo-container" style="max-width:36rem;padding:3rem 1rem">
  <section class="echo-card" role="status">
    <h1>Check your email</h1>
    <p>If an active account uses that address, a password reset link has been sent.</p>
    <p><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
  </section>
</main>
{% endblock %}
