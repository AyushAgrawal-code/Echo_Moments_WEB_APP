services:
  - type: web
    name: echomoments-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt && python scripts/download_face_models.py && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py configure_site && python manage.py check --deploy && python manage.py check_face_matching && python manage.py serve_demo
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: USE_S3
        value: "False"
      - key: USE_CLOUDINARY
        value: "True"
      - key: CLOUDINARY_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FACE_ENCRYPTION_KEY
        generateValue: true
      - key: FACE_MATCH_THRESHOLD
        value: "0.46"
      - key: EMAIL_BACKEND
        value: accounts.email_backends.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
